<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1836"/>
      <stop offset="100%" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00f5ff" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Orbital Circuit Reticle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="30 15"/>

  <!-- Central Sci-Fi Emblem -->
  <g filter="url(#glow)">
    <!-- Outer Hex -->
    <polygon points="256,90 395,170 395,330 256,410 117,330 117,170" fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Central Quantum Core -->
    <polygon points="256,135 355,193 355,307 256,365 157,307 157,193" fill="rgba(0, 245, 255, 0.08)" stroke="#00f5ff" stroke-width="5"/>
    
    <!-- Core Laser Nodes -->
    <line x1="256" y1="135" x2="256" y2="365" stroke="#00ff9d" stroke-width="6"/>
    <line x1="157" y1="193" x2="355" y2="307" stroke="#00f5ff" stroke-width="4"/>
    <line x1="157" y1="307" x2="355" y2="193" stroke="#8b5cf6" stroke-width="4"/>
    
    <circle cx="256" cy="256" r="30" fill="#040711" stroke="#00ff9d" stroke-width="8"/>
    <circle cx="256" cy="256" r="12" fill="#00f5ff"/>
  </g>

  <!-- Typography -->
  <text x="256" y="465" font-family="'Orbitron', sans-serif" font-size="34" font-weight="900" fill="#00f5ff" text-anchor="middle" letter-spacing="6">NEXUS</text>
</svg>
